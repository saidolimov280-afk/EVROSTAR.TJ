<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b2c">
<title>EVROSTAR — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f9;color:#102033}
header{background:#071b2c;color:#fff;padding:18px}.wrap{max-width:720px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #00000012;margin-bottom:18px}
h1,h2{margin-top:0}label{display:block;font-weight:700;margin:15px 0 7px}
input,select,textarea,button{width:100%;padding:14px;border:1px solid #cfd6df;border-radius:11px;font-size:16px}
textarea{min-height:140px;resize:vertical}.btn{border:0;background:#1677df;color:#fff;font-weight:800;margin-top:18px}
.secondary{background:#697887}.danger{background:#e63946}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{margin-top:14px;padding:12px;border-radius:10px;background:#eef3f7;display:none}
#preview{display:none;width:100%;max-height:280px;object-fit:contain;margin-top:12px;border-radius:12px;background:#f5f5f5}
.small{font-size:13px;color:#667789;line-height:1.45}.progress{margin-top:10px;font-weight:700}
@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:18px}}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><h1 style="margin:0">EVROSTAR • Панель администратора</h1></div></header>
<main class="wrap">
<section class="card" id="loginBox">
<h2>Вход</h2>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label>Пароль</label><input id="password" type="password" autocomplete="current-password">
<button class="btn" id="loginBtn">Войти</button>
<div class="msg" id="loginStatus"></div>
</section>

<section class="card" id="adminBox" style="display:none">
<div class="row"><div><h2 id="formTitle">Добавить товар</h2><div class="small" id="userEmail"></div></div><div><button class="secondary" id="logoutBtn">Выйти</button></div></div>

<label>Название товара</label><input id="name" placeholder="Например: EVROSTAR 630W">
<label>Цена (сомони)</label><input id="price" type="number" min="0" step="0.01" placeholder="950">
<label for="oldPrice">Прежняя цена (для скидки, необязательно)</label><input id="oldPrice" type="number" min="0" step="0.01" placeholder="1100"><div class="small" id="discountPreview" aria-live="polite">Оставьте пустым, если скидки нет.</div><label>Категория</label>
<select id="category">
<option value="solar">Солнечные системы</option>
<option value="battery">Аккумуляторы</option>
<option value="camera">Камеры</option>
<option value="internet">Роутеры / Интернет</option>
<option value="tv">TV / Электроника</option>
<option value="other">Другое</option>
</select>
<label for="availability">Наличие / Мавҷудият</label><select id="availability"><option value="unknown">Уточнить наличие / Мавҷудиятро пурсед</option><option value="in_stock">В наличии / Дар анбор ҳаст</option><option value="out_of_stock">Нет в наличии / Тамом шуд</option><option value="on_order">Под заказ / Бо фармоиш</option></select><div class="small">Статус будет виден покупателю в каталоге.</div><label>Характеристики</label><textarea id="desc" placeholder="Мощность, напряжение, особенности..."></textarea>

<label>Фото товара с телефона</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" alt="Предпросмотр">
<div class="small">Выберите JPG, PNG или WebP с телефона. Фото автоматически уменьшается и сохраняется вместе с товаром.</div>
<div class="progress" id="progress"></div>

<label>Или ссылка на фото (необязательно)</label>
<input id="imageUrl" type="url" placeholder="https://...">

<button class="btn" id="saveBtn">Сохранить товар</button><button class="secondary" id="newBtn">Новый товар / отменить редактирование</button>
<div class="msg" id="status"></div>
</section>
<section class="card" id="listBox" style="display:none"><h2>Мои товары</h2><input id="listSearch" placeholder="Найти товар"><div id="productList"></div></section></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
 apiKey: "AIzaSyA_zCecmxy5IYVzh2wESMDRZ_rZlFpWx6w",
 authDomain: "evrostar-c7c85.firebaseapp.com",
 projectId: "evrostar-c7c85",
 storageBucket: "evrostar-c7c85.firebasestorage.app",
 messagingSenderId: "869866043004",
 appId: "1:869866043004:web:4b45a671f60d5faa04bbf9",
 measurementId: "G-4EWNY50H0D"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);
function msg(id,text,ok=false){const e=$(id);e.style.display="block";e.textContent=text;e.style.background=ok?"#e8fff0":"#fff0f0";e.style.color=ok?"#126b34":"#a51d2d"}

$("loginBtn").onclick=async()=>{
 $("loginBtn").disabled=true;
 try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}
 catch(e){msg("loginStatus","Ошибка входа: "+e.message)}
 finally{$("loginBtn").disabled=false}
};
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
 $("loginBox").style.display=user?"none":"block";
 $("adminBox").style.display=user?"block":"none";
 if(user)$("userEmail").textContent=user.email||"";
});


let editId=null, existingImage="", previewURL="", products=[], stopList=null;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeImage(s){return /^https?:\/\//i.test(s)||/^data:image\/(jpeg|png|webp);base64,/i.test(s)}
function resetForm(){
 editId=null;existingImage="";$("formTitle").textContent="Добавить товар";
 ["name","price","oldPrice","desc","imageUrl","photo"].forEach(id=>$(id).value="");
 $("availability").value="unknown";updateDiscountPreview();$("preview").style.display="none";$("progress").textContent="";
 if(previewURL){URL.revokeObjectURL(previewURL);previewURL=""}
}
$("newBtn").onclick=resetForm;
$("photo").onchange=()=>{
 const f=$("photo").files[0];if(previewURL)URL.revokeObjectURL(previewURL);
 if(!f){$("preview").style.display="none";return}
 if(!/^image\/(jpeg|png|webp)$/i.test(f.type)||f.size>25*1024*1024){msg("status","Выберите JPG, PNG или WebP до 25 МБ.");$("photo").value="";return}
 previewURL=URL.createObjectURL(f);$("preview").src=previewURL;$("preview").style.display="block";
};
async function uploadPhoto(file){
 $("progress").textContent="Подготовка фото…";
 const url=URL.createObjectURL(file);
 try{
  const im=new Image();im.src=url;await im.decode();
  const canvas=document.createElement("canvas");
  let side=1400;
  for(let attempt=0;attempt<8;attempt++){
   const scale=Math.min(1,side/Math.max(im.naturalWidth,im.naturalHeight));
   canvas.width=Math.max(1,Math.round(im.naturalWidth*scale));canvas.height=Math.max(1,Math.round(im.naturalHeight*scale));
   const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL("image/jpeg",0.8);
   if(data.length<450000){$("progress").textContent="Фото готово";return data}
   side=Math.round(side*0.75);
  }
  throw new Error("Не удалось уменьшить фото. Выберите другое изображение.");
 }finally{URL.revokeObjectURL(url)}
}
function validOldPrice(raw,price){if(String(raw).trim()==='')return null;const n=Number(raw);if(!Number.isFinite(n)||n<=price||price<=0)throw new Error('Прежняя цена должна быть больше текущей, а текущая цена — больше нуля.');return n}
function updateDiscountPreview(){try{const old=validOldPrice($("oldPrice").value,Number($("price").value));$("discountPreview").textContent=old===null?'Оставьте пустым, если скидки нет.':'Скидка −'+((old-Number($("price").value))/old*100).toLocaleString('ru-RU',{maximumFractionDigits:1})+'% • Экономия '+(old-Number($("price").value)).toLocaleString('ru-RU',{maximumFractionDigits:2})+' сомони';}catch(e){$("discountPreview").textContent=e.message}}
$("price").addEventListener('input',updateDiscountPreview);$("oldPrice").addEventListener('input',updateDiscountPreview);
function availabilityValue(value){return ['in_stock','out_of_stock','on_order'].includes(value)?value:'unknown'}
function availabilityText(value){return {in_stock:'В наличии / Дар анбор ҳаст',out_of_stock:'Нет в наличии / Тамом шуд',on_order:'Под заказ / Бо фармоиш',unknown:'Наличие уточняется / Мавҷудиятро пурсед'}[availabilityValue(value)]}
function renderList(){
 const term=$("listSearch").value.toLowerCase();
 $("productList").innerHTML=products.filter(p=>String(p.name).toLowerCase().includes(term)).map(p=>`<div style="padding:14px 0;border-bottom:1px solid #ddd"><b>${esc(p.name)}</b> — ${Number(p.price)>0?Number(p.price).toLocaleString("ru-RU")+" сомони":"Цена по запросу"}<div class="small">${esc(availabilityText(p.availability))}</div><button data-edit="${esc(p.id)}">Изменить товар</button></div>`).join("")||"Товаров пока нет.";
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
  const p=products.find(p=>p.id===b.dataset.edit);if(!p)return;
  resetForm();editId=p.id;existingImage=p.image||"";$("formTitle").textContent="Изменить товар";
  ["name","price","oldPrice","category","desc"].forEach(id=>$(id).value=p[id]??"");$("availability").value=availabilityValue(p.availability);updateDiscountPreview();
  if(safeImage(existingImage)){$("preview").src=existingImage;$("preview").style.display="block"}
  $("adminBox").scrollIntoView({behavior:"smooth"});
 });
}
$("listSearch").oninput=renderList;
onAuthStateChanged(auth,user=>{
 $("listBox").style.display=user?"block":"none";
 if(stopList){stopList();stopList=null}products=[];resetForm();renderList();
 if(user)stopList=onSnapshot(collection(db,"products"),snap=>{
  products=snap.docs.map(d=>({...d.data(),id:d.id}));renderList();
 },e=>{$("productList").textContent="Не удалось прочитать товары: "+e.message});
});
$("saveBtn").onclick=async()=>{
 const name=$("name").value.trim(), price=Number($("price").value), category=$("category").value, desc=$("desc").value.trim();
 if(!Number.isFinite(price)||price<0){msg("status","Укажите корректную цену или оставьте поле пустым.");return}
 if(name.length>200||desc.length>20000){msg("status","Название до 200 знаков, описание до 20 000.");return}
 if(!name){msg("status","Введите название товара.");return}
 let oldPrice;try{oldPrice=validOldPrice($("oldPrice").value,price)}catch(e){msg("status",e.message);return}
 if(!auth.currentUser){msg("status","Сначала войдите в аккаунт администратора.");return}
 $("saveBtn").disabled=true;$("saveBtn").textContent="Сохраняем...";
 try{
   let image=$("imageUrl").value.trim()||existingImage;
   if(image&&!safeImage(image))throw new Error("Укажите ссылку https:// на фото.");
   const file=$("photo").files[0];
   if(file) image=await uploadPhoto(file);
   const data={name,price,oldPrice,category,desc,image,availability:availabilityValue($("availability").value),updatedAt:serverTimestamp()};
   if(editId)await updateDoc(doc(db,"products",editId),data);
   else await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});
   msg("status","✓ Товар сохранён и появится в каталоге.",true);resetForm();
   $("name").value="";$("price").value="";$("desc").value="";$("imageUrl").value="";$("photo").value="";
   $("preview").style.display="none";$("progress").textContent="";
 }catch(e){
   console.error(e);
   let t="Ошибка: "+e.message;
   if(String(e.code||"").includes("storage/unauthorized")) t="Нет доступа к Firebase Storage. Нужно включить Storage и разрешить загрузку для авторизованного администратора.";
   msg("status",t);
 }finally{$("saveBtn").disabled=false;$("saveBtn").textContent="Сохранить товар"}
};
</script>
</body>
</html>
