<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b2c">
<title>EVROSTAR — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f9;color:#102033}
header{background:#071b2c;color:#fff;padding:18px}header h1{margin:0;font-size:22px}
main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #0001}
h2{margin-top:0}label{display:block;font-weight:700;margin:13px 0 6px}
input,textarea,select{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:11px;font-size:16px}
textarea{min-height:100px;resize:vertical}button{width:100%;border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:700;background:#0b73e0;color:white;margin-top:14px}
button.secondary{background:#596775}button:disabled{opacity:.55}.msg{margin-top:12px;padding:11px;border-radius:10px;background:#eef4fa}
#adminBox{display:none}#imgPreview{display:none;width:100%;max-height:260px;object-fit:contain;margin-top:12px;border-radius:12px}
.small{font-size:13px;color:#5b6875}.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body>
<header><h1>EVROSTAR • Панель администратора</h1></header>
<main>
<section class="card" id="loginBox">
<h2>Вход администратора</h2>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label>Пароль</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn">Войти</button>
<div class="msg" id="loginStatus">Войдите в аккаунт администратора.</div>
</section>

<section class="card" id="adminBox">
<div class="row"><div><h2>Добавить товар</h2><div class="small" id="userEmail"></div></div><div><button class="secondary" id="logoutBtn">Выйти</button></div></div>
<label>Название товара</label><input id="name" placeholder="Например: EVROSTAR 630W">
<label>Цена (сомони)</label><input id="price" type="number" min="0" step="0.01" placeholder="950">
<label>Категория</label>
<select id="category">
<option value="solar">Солнечные системы</option>
<option value="battery">Аккумуляторы</option>
<option value="camera">Камеры</option>
<option value="internet">Роутеры / Интернет</option>
<option value="tv">TV / Электроника</option>
<option value="other">Другое</option>
</select>
<label>Характеристики</label><textarea id="desc" placeholder="Мощность, напряжение, особенности..."></textarea>
<label>Ссылка на фото</label><input id="imageUrl" type="url" placeholder="https://...">
<img id="imgPreview" alt="Предпросмотр">
<button id="saveBtn">Сохранить товар</button>
<div class="msg" id="status">Готово к добавлению товара.</div>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyA_zCecmxy5IYVzh2wESMDRZ_rZlFpWx6w",
 authDomain:"evrostar-c7c85.firebaseapp.com",
 projectId:"evrostar-c7c85",
 storageBucket:"evrostar-c7c85.firebasestorage.app",
 messagingSenderId:"869866043004",
 appId:"1:869866043004:web:4b45a671f60d5faa04bbf9",
 measurementId:"G-4EWNY50H0D"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

$("loginBtn").onclick=async()=>{
 $("loginStatus").textContent="Вход...";
 try{
  await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
 }catch(e){$("loginStatus").textContent="Ошибка входа: "+e.message}
};
$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
 if(user){
  $("loginBox").style.display="none"; $("adminBox").style.display="block";
  $("userEmail").textContent=user.email||"Администратор";
 }else{
  $("loginBox").style.display="block"; $("adminBox").style.display="none";
 }
});

$("imageUrl").addEventListener("input",()=>{
 const u=$("imageUrl").value.trim();
 $("imgPreview").style.display=u?"block":"none";
 $("imgPreview").src=u;
});

$("saveBtn").onclick=async()=>{
 const user=auth.currentUser;
 if(!user){$("status").textContent="Сначала войдите.";return}
 const name=$("name").value.trim();
 const price=Number($("price").value);
 if(!name){$("status").textContent="Введите название товара.";return}
 if(!Number.isFinite(price)||price<0){$("status").textContent="Введите правильную цену.";return}
 $("saveBtn").disabled=true;$("status").textContent="Сохранение...";
 try{
  await addDoc(collection(db,"products"),{
   name,price,
   category:$("category").value,
   description:$("desc").value.trim(),
   image:$("imageUrl").value.trim(),
   createdAt:serverTimestamp()
  });
  $("status").textContent="✓ Товар сохранён в Firestore.";
  $("name").value="";$("price").value="";$("desc").value="";$("imageUrl").value="";
  $("imgPreview").style.display="none";
 }catch(e){$("status").textContent="Ошибка сохранения: "+e.message}
 finally{$("saveBtn").disabled=false}
};
</script>
</body>
</html>
