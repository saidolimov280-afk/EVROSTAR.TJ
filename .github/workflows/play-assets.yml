name: Play Store screenshots
# Takes 1080x1920 screenshots of the live site and commits them to the "play-assets" branch.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python play/screenshots.py "$RUNNER_TEMP/shots"
      - name: Commit to play-assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan play-assets
          git rm -rqf .
          mkdir -p screenshots && cp "$RUNNER_TEMP"/shots/*.png screenshots/
          git add screenshots
          git commit -qm "Play Store screenshots from the live site"
          git push -f origin play-assets
