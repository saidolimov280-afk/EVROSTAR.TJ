name: Build EVROSTAR APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build unsigned release APK
        run: |
          gradle -p android assembleRelease --no-daemon
          mkdir output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/EVROSTAR-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: EVROSTAR-build
          path: output/
          retention-days: 7
