name: Update product list for Google
on:
  schedule:
    - cron: '7 1 * * *'   # every day ~06:07 Dushanbe time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-products
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Product share pages and photos (WhatsApp, Telegram, Google)
        # A problem here must not stop the product list for Google or the keepalive below.
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python scripts/build_share.py
      - name: Build product list from Firestore
        run: node scripts/build-seo.mjs
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- index.html sitemap.xml p)" ]; then echo "No changes"; exit 0; fi
          git config user.name "evrostar-bot"
          git config user.email "evrostar-bot@users.noreply.github.com"
          git add -A -- index.html sitemap.xml p
          git commit -m "Update product list, share pages and photos"
          git push
      - name: Keep scheduled jobs switched on
        if: always()
        # GitHub switches off scheduled workflows in public repositories after 60 days without commits.
        # The Telegram bot and this job must keep running, so after 45 quiet days make an empty commit.
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          if [ "$days" -lt 45 ]; then echo "Last commit $days days ago — nothing to do"; exit 0; fi
          git config user.name "evrostar-bot"
          git config user.email "evrostar-bot@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: scheduled jobs stay on (no commits for $days days)"
          git push
