name: Google Play release
# Run from GitHub → Actions → "Google Play release" → Run workflow.
# Needs two repository secrets: UPLOAD_KEYSTORE (base64 of the .jks) and UPLOAD_KEYSTORE_PASSWORD.
# Output: a GitHub Release with EVROSTAR.aab (upload to Play Console) and EVROSTAR.apk (direct install).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version code (higher on every run)
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Decode upload key
        id: key
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE" ]; then
            echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secrets UPLOAD_KEYSTORE / UPLOAD_KEYSTORE_PASSWORD are not set — building unsigned files only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build AAB and APK
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android bundleRelease assembleRelease --no-daemon
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab out/EVROSTAR.aab
          cp android/app/build/outputs/apk/release/app-release*.apk out/EVROSTAR.apk
          ls -l out
      - name: Verify signature
        if: steps.key.outputs.signed == 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/EVROSTAR.apk | head -5
          jarsigner -verify out/EVROSTAR.aab | tail -1
      - name: Publish GitHub Release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.2.0-${VERSION_CODE}"
          gh release create "$tag" out/EVROSTAR.aab out/EVROSTAR.apk \
            --title "EVROSTAR ${tag}" \
            --notes "EVROSTAR.aab — барои Google Play Console. EVROSTAR.apk — барои насби мустақим (имзошуда). versionCode ${VERSION_CODE}."
          echo "::notice title=Release::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
      - name: Keep unsigned build for checking
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EVROSTAR-unsigned
          path: out/
          retention-days: 3
