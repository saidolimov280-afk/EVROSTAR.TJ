name: Google Play release
# Run from GitHub → Actions → "Google Play release" → Run workflow.
# Needs two repository secrets: UPLOAD_KEYSTORE (base64 of the .jks) and UPLOAD_KEYSTORE_PASSWORD.
# Output: a GitHub Release with EVROSTAR.aab (upload to Play Console) and EVROSTAR.apk (direct install).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version code (higher on every run)
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Decode upload key
        id: key
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE" ]; then
            echo "::warning::Secrets UPLOAD_KEYSTORE / UPLOAD_KEYSTORE_PASSWORD are not set — building unsigned files only."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Text copied on a phone may contain spaces/line breaks; drop them before decoding.
          python3 - <<'PY'
          import base64, os, re, sys
          raw = re.sub(r'[^A-Za-z0-9+/=]', '', os.environ['UPLOAD_KEYSTORE'])
          print(f'::notice title=keystore::base64 length {len(raw)} (expected 3552)')
          raw += '=' * (-len(raw) % 4)
          try:
              data = base64.b64decode(raw)
          except Exception as e:
              print(f'::error title=keystore::not valid base64: {e}'); sys.exit(1)
          open(os.path.join(os.environ['RUNNER_TEMP'], 'upload.jks'), 'wb').write(data)
          print(f'::notice title=keystore::decoded {len(data)} bytes')
          PY
          pw=$(printf '%s' "$UPLOAD_KEYSTORE_PASSWORD" | tr -d '[:space:]')
          echo "::add-mask::$pw"
          echo "UPLOAD_KEYSTORE_PASSWORD_CLEAN=$pw" >> "$GITHUB_ENV"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storetype pkcs12 -storepass "$pw" -alias upload >/dev/null 2>"$RUNNER_TEMP/kt.err"; then
            echo "::error title=keystore::cannot open the keystore: $(head -c 300 "$RUNNER_TEMP/kt.err" | tr '\n' ' ')"; exit 1
          fi
          fp=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storetype pkcs12 -storepass "$pw" -alias upload | grep 'SHA256:' | head -1)
          echo "::notice title=keystore::OK $fp"
          echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build AAB and APK
        run: |
          export UPLOAD_KEYSTORE_PASSWORD="$UPLOAD_KEYSTORE_PASSWORD_CLEAN"
          gradle -p android bundleRelease assembleRelease --no-daemon
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab out/EVROSTAR.aab
          cp android/app/build/outputs/apk/release/app-release*.apk out/EVROSTAR.apk
          ls -l out
      - name: Verify signature
        if: steps.key.outputs.signed == 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/EVROSTAR.apk | head -5
          jarsigner -verify out/EVROSTAR.aab | tail -1
      - name: Publish GitHub Release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.2.0-${VERSION_CODE}"
          gh release create "$tag" out/EVROSTAR.aab out/EVROSTAR.apk \
            --title "EVROSTAR ${tag}" \
            --notes "EVROSTAR.aab — барои Google Play Console. EVROSTAR.apk — барои насби мустақим (имзошуда). versionCode ${VERSION_CODE}."
          echo "::notice title=Release::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
      - name: Keep unsigned build for checking
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EVROSTAR-unsigned
          path: out/
          retention-days: 3
